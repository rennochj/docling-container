# git-cliff configuration file
# Documentation: https://git-cliff.org/docs/configuration

[changelog]
# Changelog header
header = """
# Changelog

All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

"""

# Template for the changelog body
# https://keats.github.io/tera/docs/#introduction
body = """
{% if version -%}
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
    ## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        {%- if commit.scope -%}
            - **{{ commit.scope }}**: {{ commit.message | upper_first }}
        {%- else -%}
            - {{ commit.message | upper_first }}
        {%- endif -%}
        {% if commit.breaking -%}
            {% raw %}  {% endraw %}- **BREAKING**: {{ commit.breaking_description }}
        {%- endif -%}
        {% if commit.links %}
            {% for link in commit.links %} ([{{ link.text }}]({{ link.href }})){% endfor -%}
        {% endif %}
    {% endfor %}
{% endfor %}
"""

# Remove the leading and trailing whitespace from the body
trim = true

# Changelog footer
footer = """
<!-- generated by git-cliff -->
"""

[git]
# Parse commits based on https://www.conventionalcommits.org
conventional_commits = true
# Filter out commits that are not conventional
filter_unconventional = true
# Process each line of a commit as an individual commit
split_commits = false

# Regex for preprocessing commit messages
commit_preprocessors = [
    # Link to GitHub issues
    { pattern = '\((\w+\s)?#([0-9]+)\)', replace = "([#${2}](https://github.com/rennochj/docling-container/issues/${2}))" },
    # Remove Claude Code attribution from commit messages
    { pattern = '🤖 Generated with.*', replace = "" },
    { pattern = 'Co-Authored-By: Claude.*', replace = "" },
]

# Regex for parsing and grouping commits
commit_parsers = [
    { message = "^feat", group = "<!-- 0 -->🚀 Features" },
    { message = "^fix", group = "<!-- 1 -->🐛 Bug Fixes" },
    { message = "^docs?", group = "<!-- 2 -->📚 Documentation" },
    { message = "^perf", group = "<!-- 3 -->⚡ Performance" },
    { message = "^refactor", group = "<!-- 4 -->🚜 Refactor" },
    { message = "^style", group = "<!-- 5 -->🎨 Styling" },
    { message = "^test", group = "<!-- 6 -->🧪 Testing" },
    { message = "^build", group = "<!-- 7 -->🏗️ Build" },
    { message = "^ci", group = "<!-- 8 -->👷 CI/CD" },
    { message = "^chore\\(release\\): prepare for", skip = true },
    { message = "^chore\\(deps\\)", skip = true },
    { message = "^chore", group = "<!-- 9 -->🔧 Miscellaneous" },
    { body = ".*security", group = "<!-- 0 -->🔒 Security" },
]

# Protect breaking changes from being skipped
protect_breaking_commits = false
# Filter out commits that don't match any parser
filter_commits = false

# Glob pattern for matching git tags
tag_pattern = "v[0-9]*"
# Regex for skipping specific tags
skip_tags = ""
# Regex for ignoring tags
ignore_tags = ""

# Sort tags topologically
topo_order = false
# Sort commits inside sections by oldest/newest
sort_commits = "oldest"

# Limit the number of commits included in the changelog
# limit_commits = 42

[remote.github]
owner = "rennochj"
repo = "docling-container"
